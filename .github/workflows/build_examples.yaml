---
name: build-examples

on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  build-examples:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: load env vars for workflow run
        run: |
          source .github/vars.env
          echo "ZIG_VERSION=$ZIG_VERSION" >> "$GITHUB_ENV"

      - name: setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          # this job regenerates the (gitignored) openssl source tree from scratch on every
          # run via `generate.sh`, so a zig cache persisted/restored across runs can end up
          # referencing files that no longer exist on disk, causing zig's cache-manifest
          # hit-check to hard fail with "failed to check cache: ... file_hash FileNotFound"
          # instead of falling back to a normal cache miss/rebuild. disable cross-run caching
          # here to avoid that; the cache is still reused within this job between this step
          # and the "build the examples" step below.
          use-cache: false

      - name: ensure openssl generate step cached
        run: |
          zig build
        working-directory: lib/openssl

      - name: build the examples
        run: |
          make build-examples
